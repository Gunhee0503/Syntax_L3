<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="구문독해" />
  <meta name="description" content="수능·모의고사 지문을 청크 단위로 직독직해하고 구조를 분석하는 학습 앱" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <title>수능 구문독해 — 청크 학습</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div id="install-banner" class="install-banner" hidden>
    <div class="install-banner-text">
      <strong>홈 화면에 설치하면 더 편해요</strong>
      <span>오프라인에서도 학습 가능</span>
    </div>
    <div class="install-banner-actions">
      <button id="install-btn" class="install-btn">설치</button>
      <button id="install-dismiss" class="install-dismiss" aria-label="닫기">
        <i class="ti ti-x"></i>
      </button>
    </div>
  </div>

  <div id="update-banner" class="update-banner" hidden>
    <span>새 버전이 준비됐어요</span>
    <button id="update-btn" class="update-btn">업데이트</button>
  </div>

  <main id="app">
    <div id="set-switcher"></div>
    <div id="screen-container">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>로딩 중...</p>
      </div>
    </div>
  </main>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
  <script>
    // Service Worker 등록 — 오프라인 캐싱 + 자동 업데이트 알림
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          // 업데이트 감지
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-banner').hidden = false;
                document.getElementById('update-btn').onclick = () => {
                  sw.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                };
              }
            });
          });
        }).catch((err) => console.warn('SW registration failed:', err));
      });
    }

    // PWA 설치 프롬프트 — 안드로이드/데스크톱 Chrome
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const dismissed = localStorage.getItem('install-dismissed');
      if (!dismissed) {
        document.getElementById('install-banner').hidden = false;
      }
    });

    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-banner').hidden = true;
    });

    document.getElementById('install-dismiss').addEventListener('click', () => {
      document.getElementById('install-banner').hidden = true;
      localStorage.setItem('install-dismissed', '1');
    });
  </script>
</body>
</html>
